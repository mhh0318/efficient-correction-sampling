name: Build and deploy project page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The page is edited directly in docs/index.html; deploy it as committed (page.md is no longer the source).
      - name: Assemble site from docs/
        run: |
          mkdir _site
          cp docs/index.html docs/project.css docs/project.js docs/paper.pdf docs/.nojekyll _site/
          cp -r docs/assets _site/assets
          cp -r docs/gallery _site/gallery
      - name: Fetch full sample gallery
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY_ASSET_SHA256: 821a58b6532042d2f2480c8de9fd218380469d8074585cedd4d210cc97f3f792
        run: |
          gallery_asset_dir="${RUNNER_TEMP}/gallery-assets"
          mkdir -p "$gallery_asset_dir"
          gh release download gallery-assets-v1 --repo "$GITHUB_REPOSITORY" --pattern gallery-assets.zip --dir "$gallery_asset_dir"
          printf '%s  %s\n' "$GALLERY_ASSET_SHA256" "$gallery_asset_dir/gallery-assets.zip" | sha256sum -c -
          python -m zipfile -e "$gallery_asset_dir/gallery-assets.zip" _site/assets/gallery
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
