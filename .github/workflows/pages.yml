name: Build and deploy project page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The page is edited directly in docs/index.html; deploy it as committed (page.md is no longer the source).
      - name: Assemble site from docs/
        run: |
          mkdir _site
          cp docs/index.html docs/project.css docs/project.js docs/paper.pdf docs/.nojekyll _site/
          cp -r docs/assets _site/assets
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
