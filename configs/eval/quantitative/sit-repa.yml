checkpoint: sit-repa-50k

sampling:
  method: repa_sde
  precision: fp32
  denoising_steps: 123
  corrections_per_step: 5
  correction_interval: [0.7, 0.5] # [correction start t, correction end t], t=0.0 is data, t=1.0 is noise
  cfg: 1.0
  cfg_interval: [1.0, 0.0]

generation:
  runner: repa
  samples: 50000
  batch_size: 64
