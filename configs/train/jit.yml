model:
  model: JiT-L/16
  image_size: 256
  num_classes: 1000
  t_eps: 0.05
  noise_scale: 1.0
  p_mean: -0.8
  p_std: 0.8
  label_drop: 0.1
  prediction: x
  data_time: 1
  time_sampling: logit_normal

codec:
  name: identity
  pretrained: stabilityai/sd-vae-ft-ema
  revision: null
  scale: 0.18215
  bias: 0.0

correction:
  input: x
  output: x
  combine: direct
  gate_init: 0.0
  gate_shape: channel
  gate_mix: difference

training:
  loss_space: v
  detach_input: true
  detach_skip: false
  deterministic: false
  correction_steps: 1
  base_loss_weight: 1.0
  correction_loss_weight: 1.0
  steps: 100000
  batch_size: 32
  accumulation: 4
  lr: 5.0e-05
  betas: [0.9, 0.95]
  ema: [0.9999, 0.9996]
  precision: bf16
  gradient_precision: fp32
  gradient_bucket_mb: 25
  warmup_epochs: 5.0
  save_every: 5000
  export_every: 10000

sampling:
  method: heun
  precision: bf16
  denoising_steps: 45
  corrections_per_step: 9
  correction_interval: [1.0, 0.8] # [correction start t, correction end t], t=0.0 is data, t=1.0 is noise
  cfg: 1.0
  cfg_interval: [0.9, 0.0]
